<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>بررسی شیت‌ها</title>

<style>

body{
font-family:tahoma;
padding:20px;
background:#f5f5f5;
}

.card{

background:white;
padding:15px;
margin:15px 0;
border-radius:15px;
box-shadow:0 2px 10px #ccc;

}

pre{

white-space:pre-wrap;
direction:ltr;

}

button{

padding:12px;
border-radius:10px;
border:0;
background:#333;
color:white;

}

</style>

</head>


<body>


<h2>🔍 بررسی تمام شیت‌ها</h2>


<button onclick="loadSheets()">
خواندن شیت‌ها
</button>


<div id="result"></div>



<script src="api.js"></script>


<script>


const sheets = [

"Customers",
"Orders",
"Payments",
"Wages",
"Settings"

];



async function loadSheets(){


const result =
document.getElementById("result");


result.innerHTML =
"در حال خواندن...";



let html="";



for(const sheet of sheets){


try{


const data =
await api(
"read",
sheet
);



html += `


<div class="card">


<h3>
📄 ${sheet}
</h3>


<p>
تعداد ردیف:
${data.data.length}
</p>


<pre>
${JSON.stringify(
data.data.slice(0,5),
null,
2
)}
</pre>


</div>


`;



}catch(e){


html += `

<div class="card">

❌ خطا در ${sheet}

<br>

${e}

</div>

`;


}



}



result.innerHTML = html;



}



</script>


</body>

</html>
