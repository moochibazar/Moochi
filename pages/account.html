<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>حساب مشتری | Mochi Bazar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;

}

body{

background:#050505;
color:#fff;

background-image:

radial-gradient(circle at top,
#3d2f00 0%,
#050505 60%);

}

.container{

max-width:900px;

margin:auto;

padding:20px;

}

.header{

text-align:center;

margin-bottom:25px;

}

.logo{

font-size:42px;

color:#d4af37;

font-weight:bold;

margin-top:10px;

}

.subtitle{

margin-top:10px;

color:#bfbfbf;

font-size:15px;

}

.card{

background:#101010;

border:1px solid rgba(212,175,55,.35);

border-radius:18px;

padding:18px;

margin-bottom:18px;

box-shadow:

0 0 25px rgba(212,175,55,.08);

animation:show .35s;

}

@keyframes show{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:none;

}

}

.customerName{

font-size:30px;

font-weight:bold;

color:#FFD700;

}

.customerCode{

margin-top:8px;

color:#999;

}

.filter{

display:flex;

justify-content:center;

align-items:center;

gap:10px;

margin-top:5px;

flex-wrap:wrap;

}

.circle{

width:42px;

height:42px;

border-radius:50%;

border:none;

background:#1b1b1b;

color:#FFD700;

font-size:22px;

cursor:pointer;

transition:.25s;

}

.circle:hover{

background:#FFD700;

color:#000;

}

#limit{

width:80px;

height:42px;

text-align:center;

border-radius:10px;

border:1px solid #FFD700;

background:#111;

color:#FFD700;

font-size:18px;

}

.showBtn{

height:42px;

padding:0 22px;

background:#FFD700;

color:#000;

border:none;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}

.summary{

display:grid;

grid-template-columns:

repeat(2,1fr);

gap:15px;

}

.box{

background:#171717;

padding:15px;

border-radius:14px;

border:1px solid rgba(212,175,55,.2);

}

.box h3{

font-size:14px;

color:#bbb;

margin-bottom:10px;

}

.value{

font-size:25px;

font-weight:bold;

}

.balance{

text-align:center;

}

.balance .value{

font-size:36px;

margin-top:10px;

}

.green{

color:#32d74b;

}

.red{

color:#ff453a;

}

.sectionTitle{

font-size:23px;

color:#FFD700;

margin-bottom:15px;

}

.item{

background:#181818;

padding:15px;

border-radius:14px;

border:1px solid rgba(212,175,55,.15);

margin-bottom:12px;

}

.item h4{

color:#FFD700;

margin-bottom:10px;

}

.item p{

margin:6px 0;

color:#ddd;

}

.loading{

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

padding:50px;

}

.spinner{

width:55px;

height:55px;

border-radius:50%;

border:5px solid #333;

border-top-color:#FFD700;

animation:spin .8s linear infinite;

}

@keyframes spin{

to{

transform:rotate(360deg);

}

}

.footer{

margin:35px 0 15px;

text-align:center;

color:#666;

font-size:13px;

}

@media(max-width:700px){

.summary{

grid-template-columns:1fr;

}

.logo{

font-size:34px;

}

.customerName{

font-size:24px;

}

}

.historyTable{

width:100%;

border-collapse:collapse;

margin-top:10px;

font-size:12px;

table-layout:fixed;

}

.historyTable th{

background:#1b1b1b;

color:#FFD700;

padding:8px 4px;

border-bottom:1px solid rgba(212,175,55,.3);

border-left:1px solid rgba(212,175,55,.15);

}

.historyTable td{

padding:8px 4px;

text-align:center;

border-bottom:1px solid rgba(255,255,255,.08);

border-left:1px solid rgba(255,255,255,.05);

word-break:break-word;

  }

.historyTable tr:hover{

background:#181818;

}

  .historyTable th:nth-child(1),
.historyTable td:nth-child(1){
width:30%;
}

.historyTable th:nth-child(2),
.historyTable td:nth-child(2){
width:15%;
}

.historyTable th:nth-child(3),
.historyTable td:nth-child(3){
width:27%;
}

.historyTable th:nth-child(4),
.historyTable td:nth-child(4){
width:28%;
}

                
</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo">

🍡 MOCHI BAZAR

</div>

<div class="subtitle">

سامانه مشاهده حساب مشتری

</div>

</div>

<div class="card">

<div
id="customerName"
class="customerName">

در حال بارگذاری...

</div>

<div
id="customerCode"
class="customerCode">

</div>

</div>

<div class="card">

<div class="filter">

<button
id="minus"
class="circle">

−

</button>

<input
id="limit"
type="number"
value="30"
min="1">

<button
id="plus"
class="circle">

+

</button>

<button
id="reload"
class="showBtn">

نمایش

</button>

</div>

</div>

<div class="card balance">

<h2>

مانده حساب

</h2>

<div
id="balance"
class="value">

۰ تومان

</div>

</div>

<div class="summary">

<div class="box">

<h3>

خرید ماه اخیر

</h3>

<div
id="totalSales"
class="value">

۰

</div>

</div>

<div class="box">

<h3>

پرداخت ماه اخیر

</h3>

<div
id="totalPayments"
class="value">

۰

</div>

</div>

<div class="box">

<h3>

سفارش ماه اخیر

</h3>

<div
id="totalQty"
class="value">

۰

</div>

</div>

<div class="box">

<h3>

پرداخت‌های ماه اخیر

</h3>

<div
id="paymentCount"
class="value">

۰

</div>

</div>

</div>

<div class="card">

<div class="sectionTitle">

گردش حساب

</div>


<div style="overflow-x:auto">

<table class="historyTable">

<thead>

<tr>

<th>تاریخ</th>
<th>تعداد سفارش</th>
<th>مبلغ قابل پرداخت</th>
<th>مبلغ دریافتی</th>

</tr>

</thead>


<tbody id="historyBody">

<tr>
<td colspan="5">
در حال بارگذاری...
</td>
</tr>

</tbody>


</table>

</div>

</div>

</div>

<script src="../config/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sheet.js"></script>

<script>

const params = new URLSearchParams(location.search);

const customerCode = params.get("code");

let customer = null;

let limit = 30;

function formatMoney(number){

    return Number(number)
    .toLocaleString("en-US") + " تومان";

}

function showLoading(){

document.getElementById("historyBody").innerHTML=`

<tr>

<td colspan="4">

در حال بارگذاری...

</td>

</tr>

`;

}

async function loadCustomer(){

showLoading();

const result =
await Sheet.getCustomers();

if(!result.success){

alert("خطا در دریافت اطلاعات");

return;

}

customer =
result.data
.slice(1)
.find(item=>item[2]==customerCode);

if(!customer){

document.body.innerHTML=`

<div style="

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-size:25px;

background:#000;

color:#fff;

">

مشتری پیدا نشد

</div>

`;

return;

}

document.getElementById("customerName").innerText =
customer[1];

document.getElementById("customerCode").innerText =
"کد مشتری : " + customer[2];

loadData();

}

document.getElementById("plus").onclick=()=>{

let input =
document.getElementById("limit");

input.value =
Number(input.value)+1;

};

document.getElementById("minus").onclick=()=>{

let input =
document.getElementById("limit");

if(Number(input.value)>1){

input.value =
Number(input.value)-1;

}

};

document.getElementById("reload").onclick=()=>{

limit =
Number(document.getElementById("limit").value);

showLoading();

loadData();

};

  async function loadData(){

const ordersResult =
await Sheet.getOrders();

const paymentsResult =
await Sheet.getPayments();

const orders =
ordersResult.data
.slice(1)
.filter(item=>item[1]==customer[1]);

const payments =
paymentsResult.data
.slice(1)
.filter(item=>item[1]==customer[1]);

const oneMonthAgo = new Date();
oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);

const recentOrders = orders;

const recentPayments = payments;

let totalSales=0;

let totalPayments=0;

let totalQty=0;

recentOrders.forEach(item=>{

    totalSales += Number(item[4]) || 0;

    totalQty += Number(item[2]) || 0;

});

recentPayments.forEach(item=>{

    totalPayments += Number(item[2]) || 0;

});

document.getElementById("totalSales").innerText =
formatMoney(totalSales);

document.getElementById("totalPayments").innerText =
formatMoney(totalPayments);

document.getElementById("totalQty").innerText =
totalQty;

document.getElementById("paymentCount").innerText =
recentPayments.length;

let allSales = 0;
let allPayments = 0;

orders.forEach(item=>{
    allSales += Number(item[4]) || 0;
});

payments.forEach(item=>{
    allPayments += Number(item[2]) || 0;
});

const balance = allSales - allPayments;
    
const balanceBox =
document.getElementById("balance");

balanceBox.innerText =
formatMoney(Math.abs(balance));

balanceBox.classList.remove("green");
balanceBox.classList.remove("red");

if(balance>0){

balanceBox.classList.add("red");

}else{

balanceBox.classList.add("green");

}

const transactions = [];

orders.forEach(item=>{

    transactions.push({

    type:"order",

    date: new Date(item[5]),
    qty:Number(item[2])||0,

    sale:Number(item[4])||0,

    payment:0

});

});

payments.forEach(item=>{

    transactions.push({

    type:"payment",

    date:new Date(item[3]),

    qty:0,

    sale:0,

    payment:Number(item[2])||0

});
});

// اول قدیمی به جدید مرتب می‌کنیم
const daily = {};

transactions.forEach(item=>{

    const key = item.date.getFullYear()+"-"+(item.date.getMonth()+1)+"-"+item.date.getDate();

    if(!daily[key]){

        daily[key]={
            date:item.date,
            qty:0,
            sale:0,
            payment:0
        };

    }

    daily[key].qty += item.qty;
    daily[key].sale += item.sale;
    daily[key].payment += item.payment;

});


const merged = Object.values(daily);


merged.sort((a,b)=>a.date-b.date);


let runningBalance = 0;


merged.forEach(item=>{

    runningBalance += item.sale;
    runningBalance -= item.payment;

    item.balance = runningBalance;

});


merged.reverse();


let html = "";


merged.slice(0,limit).forEach(item=>{

html += `


<tr>

<td>${item.date.toISOString().split("T")[0].replace(/-/g,"/")}</td>

<td>${item.qty || "-"}</td>

<td>${item.sale ? formatMoney(item.sale) : "-"}</td>

<td>${item.payment ? formatMoney(item.payment) : "-"}</td>

</tr>

`;

});




if(html===""){

html = `

<tr>

<td colspan="4">

اطلاعاتی وجود ندارد

</td>

</tr>

`;

}

document.getElementById("historyBody").innerHTML = html;

let title="";

if(balance>0){

title="بدهکار";

}else if(balance<0){

title="بستانکار";

}else{

title="تسویه";

}

document.getElementById("balance").innerHTML =

`

${formatMoney(Math.abs(balance))}

<br>

<span style="font-size:18px">

${title}

</span>

`;

}

loadCustomer();

</script>

</div>

</body>

</html>
