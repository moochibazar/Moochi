<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>بررسی شیت‌ها</title>

<style>

body{
font-family:tahoma;
padding:20px;
}

.card{

border:1px solid #ccc;
padding:15px;
margin:10px 0;
border-radius:10px;

}

pre{

white-space:pre-wrap;
background:#f5f5f5;
padding:10px;
overflow:auto;

}

h2{

color:#333;

}

</style>

</head>


<body>


<h2>🔍 بررسی تمام شیت‌ها</h2>


<div id="result">

در حال خواندن شیت‌ها...

</div>



<script src="../js/api.js"></script>

<script src="../js/sheet.js"></script>


<script>


async function checkSheets(){


const box =
document.getElementById("result");


const sheets = [

"Customers",
"Orders",
"Payments",
"Wages",
"Settings"

];



box.innerHTML = "";



for(let name of sheets){


try{


const result =
await api(
"read",
name
);



box.innerHTML += `


<div class="card">


<h3>
✅ ${name}
</h3>


<pre>
${JSON.stringify(result,null,2)}
</pre>


</div>


`;



}catch(error){


box.innerHTML += `


<div class="card">


<h3>
❌ خطا در ${name}
</h3>


<p>
${error}
</p>


</div>


`;

}



}



}


checkSheets();



</script>


</body>

</html>
